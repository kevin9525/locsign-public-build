name: build
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: locsign-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Swift 6.2 capable Xcode
        run: |
          python3 - <<'PY'
          import glob, os, plistlib, subprocess
          candidates = []
          for path in glob.glob('/Applications/Xcode*.app'):
              with open(path + '/Contents/Info.plist', 'rb') as source:
                  version = plistlib.load(source)['CFBundleShortVersionString']
              parts = tuple(int(piece) for piece in version.split('.') if piece.isdigit())
              if parts >= (26, 0):
                  candidates.append((parts, path))
          if not candidates:
              raise SystemExit('No installed Xcode with Swift 6.2 found')
          version, path = max(candidates)
          subprocess.run(['sudo', 'xcode-select', '-s', path + '/Contents/Developer'], check=True)
          os.makedirs('build', exist_ok=True)
          with open('build/toolchain.log', 'w') as log:
              for command in (['xcodebuild', '-version'], ['xcrun', 'swift', '--version']):
                  result = subprocess.run(command, check=True, capture_output=True, text=True)
                  print(result.stdout)
                  log.write(result.stdout)
          PY
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: |
          xcodegen generate
          mkdir -p LocSign.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp .ci/Package.resolved LocSign.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
      - name: Restore dependency build cache
        id: dependencies
        uses: actions/cache/restore@v4
        with:
          path: |
            build/SourcePackages
            build/Build
            build/ModuleCache.noindex
          key: locsign-xcode26-${{ runner.arch }}-${{ hashFiles('.ci/Package.resolved', 'Vendor/**/Package.swift', 'build/toolchain.log') }}-${{ github.sha }}
          restore-keys: |
            locsign-xcode26-${{ runner.arch }}-${{ hashFiles('.ci/Package.resolved', 'Vendor/**/Package.swift', 'build/toolchain.log') }}-
      - name: Resolve package dependencies
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -resolvePackageDependencies -project LocSign.xcodeproj -scheme LocSign \
            -derivedDataPath build -onlyUsePackageVersionsFromResolvedFile 2>&1 | tee build/resolve-packages.log
      - name: Record Apple toolchain
        run: |
          mkdir -p build
          xcodebuild -version | tee build/xcode-version.log
          swift --version | tee build/swift-version.log
      - name: Packaging tests
        run: python3 -m unittest discover -s Tests/BuildTools -v
      - name: Build simulator dependency probe
        run: |
          set -o pipefail
          xcodebuild build -project LocSign.xcodeproj -scheme LocSign \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/simulator-probe.log | xcbeautify
      - name: Unit tests (simulator)
        timeout-minutes: 25
        run: |
          set -o pipefail
          mkdir -p build
          SIMULATOR_ID=$(python3 - <<'PY'
          import json, subprocess
          data = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '--json']))
          candidates = []
          for runtime, devices in data['devices'].items():
              if '.iOS-' not in runtime:
                  continue
              version = tuple(int(part) for part in runtime.split('.iOS-')[1].split('-'))
              for device in devices:
                  if device.get('isAvailable') and device['name'].startswith('iPhone'):
                      candidates.append((version, device['name'], device['udid']))
          if not candidates:
              raise SystemExit('No available iPhone simulator for the selected Xcode')
          print(max(candidates)[2])
          PY
          )
          xcodebuild test -project LocSign.xcodeproj -scheme LocSign \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -parallel-testing-enabled NO \
            -resultBundlePath build/TestResults.xcresult \
            -derivedDataPath build 2>&1 | tee build/tests.log | xcbeautify
      - name: Save simulator diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: LocSign-simulator-diagnostics
          path: |
            build/tests.log
            build/simulator-probe.log
            build/TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7
      - name: Build device (unsigned)
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          xcodebuild build -project LocSign.xcodeproj -scheme LocSign \
            -sdk iphoneos -configuration Release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath build 2>&1 | tee build/device.log | xcbeautify
      - name: Assemble unsigned IPA
        run: python3 .ci/make-ipa.py
      - uses: actions/upload-artifact@v4
        with:
          name: LocSign-ipa
          path: build/LocSign.ipa
          if-no-files-found: error
      - name: Save build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LocSign-diagnostics
          path: |
            build/*.log
            build/TestResults.xcresult
            LocSign.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if-no-files-found: ignore
          retention-days: 7
      - name: Save dependency build cache
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.dependencies.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            build/SourcePackages
            build/Build
            build/ModuleCache.noindex
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
